version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: scraper_password
      POSTGRES_DB: bangalore_marketplace
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper"]
      interval: 10s
      timeout: 5s
      retries: 5

  scraper:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://scraper:scraper_password@postgres:5432/bangalore_marketplace
      LOG_LEVEL: INFO
      PLAYWRIGHT_HEADLESS: "true"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    command: python main.py status

volumes:
  postgres_data:
